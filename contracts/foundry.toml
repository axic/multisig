[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# `vm.getCode("solcore/out/<Name>.json")` reads the solcore-compiled artifacts.
# They live OUTSIDE forge's `out/` so `forge clean` never wipes them.
fs_permissions = [{ access = "read", path = "./solcore/out" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
